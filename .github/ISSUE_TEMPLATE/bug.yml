name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, raw conversations, or private ledgers. See SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include OS and Node.js version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Core, Claude adapter, CLI, Panel, Docker or CI, Documentation, Unsure]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted output
    validations:
      required: true
