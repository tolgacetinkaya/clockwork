name: Repository labels

on:
  push:
    branches: [main]
    paths: ['.github/labels.json', '.github/scripts/sync-labels.mjs', '.github/workflows/labels.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-labels
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tolgacetinkaya/clockwork' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update declared labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-labels.mjs
